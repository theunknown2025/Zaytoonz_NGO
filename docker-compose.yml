# =============================================================================
# Zaytoonz NGO — Production deployment
# Server: 168.231.87.171   Domain: https://zaytoonz.com
#
# Services:
#   nextjs          — Next.js web app (Social landing at /, web app at /app)
#   python-scraper  — Scrape_Master FastAPI (proxied by nginx at /scraper-api)
#   nginx           — Reverse proxy with SSL (auto-switches HTTP ↔ HTTPS)
#   certbot         — Let's Encrypt SSL auto-renewal
#
# Only nginx is exposed publicly (80/443). nextjs and python-scraper are bound
# to 127.0.0.1 so they can be debugged from the server but not from the internet.
#
# See DEPLOY_NEW_SERVER.md for the full step-by-step guide.
# =============================================================================

services:

  # ── Next.js Web App ────────────────────────────────────────────────────────
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.webapp
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_OPENAI_API_KEY=${NEXT_PUBLIC_OPENAI_API_KEY}
        - NEXT_PUBLIC_USE_EXTERNAL_SCRAPER=${NEXT_PUBLIC_USE_EXTERNAL_SCRAPER:-true}
        - NEXT_PUBLIC_EXTERNAL_SCRAPER_URL=${NEXT_PUBLIC_EXTERNAL_SCRAPER_URL:-http://python-scraper:8000}
        - NEXT_PUBLIC_FALLBACK_TO_LOCAL=${NEXT_PUBLIC_FALLBACK_TO_LOCAL:-false}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://zaytoonz.com}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://zaytoonz.com}
    image: zaytoonz-nextjs:latest
    container_name: zaytoonz-nextjs
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEXT_PUBLIC_OPENAI_API_KEY=${NEXT_PUBLIC_OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-2000}
      - NEXT_PUBLIC_USE_EXTERNAL_SCRAPER=${NEXT_PUBLIC_USE_EXTERNAL_SCRAPER:-true}
      - NEXT_PUBLIC_EXTERNAL_SCRAPER_URL=${NEXT_PUBLIC_EXTERNAL_SCRAPER_URL:-http://python-scraper:8000}
      - SCRAPER_INTERNAL_URL=http://python-scraper:8000
      - NEXT_PUBLIC_FALLBACK_TO_LOCAL=${NEXT_PUBLIC_FALLBACK_TO_LOCAL:-false}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://zaytoonz.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://zaytoonz.com}
      - ACCESS_GATE_ENABLED=${ACCESS_GATE_ENABLED:-true}
      - ACCESS_GATE_EMAIL=${ACCESS_GATE_EMAIL}
      - ACCESS_GATE_PASSWORD=${ACCESS_GATE_PASSWORD}
      - ACCESS_GATE_SECRET=${ACCESS_GATE_SECRET}
      - ADMIN_FORMS_TEMPLATE_USER_ID=${ADMIN_FORMS_TEMPLATE_USER_ID:-}
    volumes:
      - ./public:/zaytoonz/public:ro
    restart: unless-stopped
    networks:
      - zaytoonz-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Python Scraper (Scrape_Master) ─────────────────────────────────────────
  python-scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    image: zaytoonz-scraper:latest
    container_name: zaytoonz-scraper
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SCRAPER_CORS_ORIGINS=${SCRAPER_CORS_ORIGINS:-https://zaytoonz.com,https://www.zaytoonz.com}
    restart: unless-stopped
    networks:
      - zaytoonz-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  # Auto-selects HTTP-only config when no certs exist,
  # or full HTTPS config once Let's Encrypt certs are in place.
  nginx:
    image: nginx:alpine
    container_name: zaytoonz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-webapp.conf:/etc/nginx/conf.d/nginx-https.conf:ro
      - ./nginx-init.conf:/etc/nginx/conf.d/nginx-http.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    entrypoint: >
      sh -c "
        if [ -f /etc/letsencrypt/live/zaytoonz.com/fullchain.pem ]; then
          echo '[nginx] SSL certs found — starting in HTTPS mode';
          cp /etc/nginx/conf.d/nginx-https.conf /etc/nginx/nginx.conf;
        else
          echo '[nginx] No SSL certs yet — starting in HTTP-only mode';
          cp /etc/nginx/conf.d/nginx-http.conf /etc/nginx/nginx.conf;
        fi;
        rm -f /etc/nginx/conf.d/default.conf;
        nginx -t && nginx -g 'daemon off;'
      "
    restart: unless-stopped
    depends_on:
      nextjs:
        condition: service_healthy
    networks:
      - zaytoonz-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Certbot SSL / Auto-renewal ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: zaytoonz-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --quiet --webroot -w /var/www/certbot;
          sleep 12h & wait $${!};
        done"
    restart: unless-stopped
    networks:
      - zaytoonz-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  zaytoonz-network:
    driver: bridge

# ── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  nginx-cache:
    driver: local
  nginx-logs:
    driver: local
