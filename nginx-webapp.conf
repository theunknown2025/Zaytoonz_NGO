# ─────────────────────────────────────────────────────────────────────────────
# nginx-webapp.conf  —  Phase 2: Full HTTPS (after SSL certs obtained)
# zaytoonz.com is canonical; www.zaytoonz.com and any other host redirect here.
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Docker DNS: resolve python-scraper lazily so nginx starts even if it is down
    resolver 127.0.0.11 valid=30s ipv6=off;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # nextjs is resolved per request (set $nextjs_upstream below), not in an upstream{}
    # block: an upstream pins the container IP at nginx start, so recreating the nextjs
    # container (./deploy.sh nextjs) would leave nginx on a stale IP and return 502.

    ssl_certificate     /etc/letsencrypt/live/zaytoonz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaytoonz.com/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_session_tickets       off;

    # ── HTTP → HTTPS redirect + ACME challenge ────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://zaytoonz.com$request_uri;
        }
    }

    # ── www.zaytoonz.com and unknown hosts → zaytoonz.com ─────────────────
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name www.zaytoonz.com _;

        return 301 https://zaytoonz.com$request_uri;
    }

    # ── Main HTTPS server — zaytoonz.com ──────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name zaytoonz.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options            "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

        client_max_body_size 100M;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Scraper API (Scrape_Master FastAPI)
        location /scraper-api/ {
            set $scraper_upstream python-scraper:8000;
            rewrite ^/scraper-api/(.*)$ /$1 break;
            proxy_pass http://$scraper_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout  75s;
        }

        location /_next/static/ {
            set $nextjs_upstream nextjs:3000;
            proxy_pass http://$nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            set $nextjs_upstream nextjs:3000;
            proxy_pass http://$nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout  75s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_cache_bypass $http_upgrade;
        }

        location ~ /\.(?!well-known) {
            deny all;
            access_log    off;
            log_not_found off;
        }
    }
}
